  # - f_intangibles_to_equity -> to review because 2 different regimes
  # - f_sbc_intensity -> 2 regimes ? cut 0.04

  # PRICE VARS
  - ma_ratio_200
  - ma_ratio_50 # can be killed, redundant
  - rsi_14
  # BETA RES VOL -> excluded even if significant -> weird, to investigate

  # GOV VARS
