# modellling.yml -- GENERIC / shared model config only.
# Per-model hyperparameters AND feature sets now live in their own files (merged in by
# read_config via distinct top-level keys):
#   * linear_modelling.yml  -> `linear:`  (elastic-net: hyperparams + its columns)
#   * lgbm_modelling.yml     -> `lgbm:`    (LightGBM: hyperparams + monotone + categoricals + columns)
# This split lets each model carry its own variables/tuning and makes adding a third
# family (e.g. random_forest_modelling.yml -> `random_forest:`) a drop-in.
model:
  label_column: y
  target_type: zscore          # preserve target magnitude in fitting.
  horizons: [30, 60, 90]
  ensemble: [elasticnet, lgbm, random_forest]   # families to train; per-day-standardized preds are averaged.

  models_dir: output/models    # fitted members (model_h<h>_<family>.pkl) + metadata.json, under the
                               # data store (absolute paths are used as-is)
  weight_decay:
    enabled: false             # OFF: time-decay up-weighted recent folds
    half_life_years: 10
  cv:
    n_splits: 5
    embargo: null              # defaults to each target horizon when null
    test_windows:
    - [2000-01-01, 2002-12-31]
    - [2003-01-01, 2006-12-31]
    - [2007-01-01, 2012-12-31]
    - [2013-01-01, 2018-12-31]
    - [2019-01-01, 2021-12-31]

  diagnostics:                # Required assessment artifacts under the named dated run.
    dependence_sample: 1000   # Display rows; retain the full sampled contributions separately.
    shap_sample: 12000        # Explanation budget across configured fold tests, plus this many cutoff rows.
    pdp_grid: 30               # partial-dependence grid resolution
    pdp_background: 2000
    rolling_window: 252

  assessment:
    output_dir: output/modelling_backtest
    evaluation_start: 2022-01-03
    read_chunksize: 25000      # I/O batching only; no change to fitting rows or model parameters.

train:
  start_date: 1999-01-01
  end_date: 2022-01-01
  outcome_cutoff: 2021-12-31
