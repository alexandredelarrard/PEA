backtest:
  # window
  end: null                    # null -> cube max date
  starting_capital: 1000000
 
  # --- construction (optimizer) ---
  market_weight: 0.0            # deliberate SPY beta sleeve (total portfolio beta = this)
  target_ann_vol: 0.08         # alpha-sleeve ex-ante volatility target
  beta_neutral: true           # enforce beta'w = 0 (market-neutral alpha sleeve)
  pos_cap: 0.05                # max |weight| per name
  gross_cap: 3.0               # max sum|w| (leverage safety)
 
  # --- turnover control (the cost fix) ---
  step: 0.35                   # partial trade toward target; lower = slower = cheaper
  no_trade_band: 0.0           # optional: skip per-name trades smaller than this
  rebalance_freq: 1            # recompute target every N days
 
  # --- risk-model windows ---
  beta_window: 63
  vol_window: 63
 
  # --- costs / blend ---
  fee_bps: 1.0
  spread_bps: 5.0
  blend: ir                    # ir | equal  (multi-horizon combine)
  risk_free_rate: 0.0