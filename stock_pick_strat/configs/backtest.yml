backtest:
  # window
  end: null                    # null -> cube max date
  starting_capital: 1000000
 
  # --- construction (optimizer) ---
  market_weight: 0.0          # deliberate SPY beta sleeve (total portfolio beta = this)
  target_ann_vol: 0.1          # alpha-sleeve ex-ante volatility target
  beta_neutral: true           # enforce beta'w = 0 (market-neutral alpha sleeve)
  sector_neutral: true         # enforce net exposure ~0 per GICS industry group (24)
  pos_cap: 0.05                # max |weight| per name
  gross_cap: 3.0               # max sum|w| (leverage safety)
 
  # --- turnover control (the cost fix) ---
  step: 0.35                   # partial trade toward target; lower = slower = cheaper
  no_trade_band: 0.0           # optional: skip per-name trades smaller than this
  rebalance_freq: 63            # recompute target every N days

  # --- vol-regime de-risking (less volatile through high-vol periods) ---
  vol_scaling: true            # scale BOTH sleeves by clip(target/trailing-SPY-vol, floor, cap)
  regime_target_vol: 0.15      # SPY ann-vol at which the exposure multiplier = 1.0
  regime_vol_window: 63        # trailing window for the SPY vol estimate
  regime_scale_floor: 0.3      # min exposure in a deep vol spike (2020/2022)
  regime_scale_cap: 1.5        # max exposure in calm markets

  # --- risk-model windows ---
  beta_window: 63
  vol_window: 63

  # --- costs / blend ---
  fee_bps: 1.0
  spread_bps: 5.0
  blend: ir                    # ir | equal  (multi-horizon combine)
  risk_free_rate: 0.03
  compare: true                # run + log the OOS construction comparison vs SP500
  compare_market_weight: 1.0   # SPY sleeve for the "with spy" comparison variant

  # --- multi-STRATEGY blend (day-by-day, vol-weighted across sleeves) ---
  # Blend several diversifying return streams into one book: inverse-vol (risk-parity) mix across
  # sleeves + one portfolio-level leverage to hit `portfolio_vol_target`. Recomputed every day
  # from trailing vols (point-in-time). The trend sleeve is read from `trend_asset_returns`
  # (run StepTrendAssetClass first). See src/post_processing/utils/strategies_blend.py.
  strategy_blend:
    enabled: true
    # Two diversifying sleeves only: the market-NEUTRAL equity alpha + the multi-asset trend book.
    # No standalone SPY sleeve — the equity BETA is provided DYNAMICALLY by trend's equity leg
    # (long when equities trend up, flat/short when they roll over), so market exposure isn't
    # double-counted. (Trend risk-budgets across asset classes internally; see modelling_trend_asset.)
    strategies: [equity_ls, trend_asset]
    scheme: inverse_vol         # inverse_vol (risk parity) | equal
    vol_window: 63              # trailing window for per-sleeve + portfolio vol
    portfolio_vol_target: 0.10  # annualized total-book volatility target
    max_weight: 0.7             # cap any single sleeve's mix weight
    max_leverage: 2.0           # cap total leverage applied to hit the vol target