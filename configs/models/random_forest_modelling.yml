# random_forest_modelling.yml -- Random Forest member (merged via read_config, key `random_forest`).
# Implemented as LightGBM in `boosting: rf` mode: bagged, INDEPENDENT trees (no boosting) --
# so it handles the cube's NaNs + native categoricals + monotone constraints, unlike sklearn's
# RandomForest (which needs imputation + one-hot). Select inputs in columns/columns_by_horizon;
# lgbm.categoricals assigns their types and lgbm.monotonic supplies directions at every horizon.
# Add "random_forest" to model.ensemble in modellling.yml to include it in the blend.
random_forest:
  task: regression             # regression | classification (classification needs a {0,1} label)
  boosting: rf
  num_boost_round: 500         # number of bagged trees (RF: more trees lower variance, no overfit)
  bagging_fraction: 0.7        # row subsample per tree (REQUIRED for rf mode, with bagging_freq>0)
  bagging_freq: 1
  feature_fraction: 0.7        # column subsample per tree -> decorrelates the trees
  max_depth: 8                 # fuller trees than the GBDT; variance averaged out by bagging
  num_leaves: 127
  min_child_samples: 100
  lambda_l1: 2.0
  lambda_l2: 2.0

  # Complete default feature list, including selected categorical inputs.
  # Used for ANY horizon that has no entry under columns_by_horizon.
  categoricals:
  - industry_group
  - sector
  # Shared by LGBM and RF at all horizons, aligned to selected fitted inputs.
  monotonic:
    enabled: true
    features:
    - f_reported_expected_eps_yield: 1
    - f_intangibles_to_assets: -1
    - f_pct_independent_directors: 1
    - ma_ratio_200: -1
    - ma_ratio_50: -1
