  # last-run date as its `since` cutoff on routine runs, but forces a full
  # years_history relist every N days so a filing missed by a bug, or one EDGAR
  # posts out of date order, cannot stay silently unseen forever. See
  # src/data_extract/utils/common/run_manifest.py.
  manifest_full_rescan_days: 30
