# linear_modelling.yml -- elastic-net member: hyperparameters + its OWN (leaner) feature
# set. Merged via read_config (top-level key `linear`). alpha .001/l1 .3 (alpha .05 zeroed
# all coefs -> NaN). Drops the sparse sector-specific features (NaN->0 for a linear model)
# and the f_ec_* (not in the cube yet).
linear:
  kind: elasticnet
  alpha: 0.001
  l1_ratio: 0.6
  max_iter: 1000
  tol: 1.0e-06
  columns:
  - f_ic_shortvol_ratio_20d_vs_peers
  - f_goodwill_impairment_intensity_vs_peers
  - f_rd_capitalized_roic
  - f_current_ratio
  - f_pegy
  - f_negative_equity
  - f_patent_cliff_xs
  - f_pension_overhang_leverage
  - f_intangible_amortization_share_vs_peers
  - volume_trend_63
  - f_nwc_elasticity
  - f_dio
  - f_gross_profitability
  - f_ic_insider_net_buy_ratio_180d
  - f_gmroi
  - f_deferred_rev_intensity
  - f_patent_cliff_vs_peers
  - f_debtToEquity
  - f_dividend_growth
  - f_days_payable_outstanding_xs
  - f_fcf_yield
  - f_acquisition_intensity
  - f_refinancing_risk
  - f_fixed_cost_coverage_margin
  - f_goodwill_intangibles_to_assets_vs_peers
  - f_gross_margin_chg
  - f_diluted_shares_growth
  - volume_cv_63
  - f_ic_insider_buy_value_mcap_180d_xs
  - f_ic_super_initiations_xs
