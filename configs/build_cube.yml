build_cube:
  # No market_ticker: the market reference is a SERIES in `prices_macro`, identified by name
  # (constants.MACRO_MARKET_SERIES), not a configurable ticker symbol in `prices`.

  betas:                       # rolling multi-factor loadings epsilon is residualized on
    window: 126                # trailing estimation window (trading days). Was 63: at that
                               # length the cross-sectional slope of the REALIZED in-window
                               # beta on the ex-ante one is only 0.43, i.e. 57% of the beta's
                               # dispersion is noise and the hedge over-shoots by that much.
    min_obs: 80                # observations needed before a beta is emitted (scaled with window)
    ridge_alpha: 1.5           # shrinkage RATIO: lambda = ridge_alpha * N, so an orthogonal
                               # factor is shrunk by 1/(1+alpha) at EVERY window length.
    ridge_alpha_market: 0.48   # market's OWN ratio: it shrinks toward 1.0 rather than 0.0 and
                               # forecasts its window far better than the macro loadings do,
                               # so it needs much less. 
    market_prior: 1.0          # beta_market shrinks toward 1.0 (its natural centre)
    step: 1                    # re-fit every N days. 1 = daily => no 5-day staircase
    ffill_limit: 21            # carry a beta at most N days over a gap with no estimable window

  targets:
    horizons: [30, 60, 90]
    primary_horizon: 60
    labels: [rank, zscore, epsilon]   
    min_names: 20
    # Every label is finally PROJECTED cross-sectionally orthogonal to EVERY fitted loading +
    # momentum + log market cap + GICS industry_group indicators, jointly and AFTER the
    # rank/zscore transform. Subtracting beta*factor is not enough on its own: a signal built
    # from nothing but a name's market beta earned rank-IC +0.073 (t +10.3) against the
    # un-projected label. The loading list is DERIVED from the fitted betas (see
    # `targets.fitted_beta_columns`) rather than listed here: a hand-kept list let a newly
    # added factor's loading leak into the label until somebody remembered to edit it, and the
    # loadings that had been left out were measured to leak no more than the ones left in.
    neutralize_momentum: true  # ALSO project out the 12-1 momentum CHARACTERISTIC. This zeroes
                               # the mom_12_1 feature's own IC by construction -- deliberate for
                               # a cheap price-based risk premium, and exactly why the value and
                               # vol characteristics are NOT treated the same way.
    neutralize_log_mcap: true  # ALSO project out log market cap. `beta_size` is a LOADING on the
                               # size factor's RETURN and does not span the size CHARACTERISTIC
                               # (R^2 0.26 across names, 59% of the size ordering unspanned by
                               # the whole design), so `-log_mcap` earned free rank-IC
                               # +0.0254/+0.0380/+0.0443 at h=30/60/90 (t up to +7.4); this takes
                               # h=60 to +0.0051. Un-shrinking beta_size is NOT a substitute -- a
                               # deliberate 5x over-hedge still leaves t +4.4 while injecting
                               # beta noise. vol_63 stays OUT: it would zero the vol_63 feature.
                               # Unlike the beta/sector tilts, a size tilt is neutralized nowhere
                               # downstream (strategy_ls.yml enforces beta+sector only), so it
                               # would flow straight into the live book.
    vol_standardize: true     # divide epsilon by its own trailing risk

  features:
    standardize_method: rank # rank | zscore

  intrinsic:                 # two-stage DCF for the intrinsic-value features
    discount_rate: 0.10      # equity discount rate r
    terminal_growth: 0.025   # perpetuity growth g_term (must be < r)
    years: 5                 # explicit high-growth stage length
    growth_cap: 0.15         # winsorize the firm's own growth used in the DCF
    growth_floor: -0.10

  hist:                      # self-history (valuation mean-reversion) window for
                             # the f_<yield>_vs_hist features ("cheap vs own past")
    window: 1260             # ~5 trading years of trailing daily observations
    min_periods: 252         # need >= 1y of history before emitting a z-score

  composites:                # thematic COMPOSITE signals (comp_<theme>). ADDITIVE:
                             # raw features are KEPT; composites are extra columns
                             # (no information lost). A '-' prefix inverts a member
                             # so every member reads "higher = long side" before the
                             # NaN-tolerant average. Members absent from the cube are
                             # skipped. See utils/composites.py.
    enabled: true
    method: zscore           # zscore | rank (per-day cross-sectional standardization)
    #
    # THREE RULES every group follows (see utils/composites.py for the machinery):
    #
    #  1. ONE VIEW PER CONCEPT. `_xs` is the UNIVERSE percentile of the LEVEL,
    #     `_vs_peers` the peer-basket z, `_vs_hist` the firm's own 1260d history.
    #     Never put two views of the same underlying in one group -- `value` used to
    #     carry five yields as both `_xs` and `_vs_hist`, so half its weight was a
    #     time-series re-rating bet wearing the cross-sectional value label. The
    #     re-rating view now has its own group.
    #  2. SECTOR-VARYING metrics use `_vs_peers`, sector-neutral ones use `_xs`.
    #     A universe percentile of gross margin or revenue-per-employee ranks
    #     INDUSTRIES, not firms; accruals, issuance, surprise and momentum are
    #     comparable across the whole universe and stay on `_xs`.
    #  3. HOMOGENEOUS COVERAGE. The composite is a NaN-tolerant mean, so a member
    #     that is populated for only one sector would silently change what the score
    #     MEANS for those names. Sparse / sector-only metrics therefore live in their
    #     own groups (pension_risk, bank_*, insurance_*, reit_*, energy_*) instead of
    #     diluting the universal ones.
    groups:
      # ---- VALUE: cross-sectional cheapness. Multi-metric on purpose: a composite of
      #      several yields beats any single ratio (O'Shaughnessy VC2, AQR). ----
      value: [f_ebitda_to_ev_xs, f_fcf_to_ev_xs, f_fcf_yield_xs,
              f_earnings_yield_xs, f_sales_yield_xs, f_book_yield_xs,
              f_intrinsic_yield_xs, f_eps_yield_xs, "-f_pegy_xs"]   # low PEGY = cheap vs growth
      # ---- VALUE RE-RATING: the SAME yields vs the firm's own past (split out of value) ----
      value_rerating: [f_ebitda_to_ev_vs_hist, f_fcf_to_ev_vs_hist, f_fcf_yield_vs_hist,
                       f_earnings_yield_vs_hist,
                       f_sales_yield_vs_hist, f_book_yield_vs_hist, f_intrinsic_yield_vs_hist]

      # ---- QUALITY: profitability OUTPUTS. Margins are sector-bound -> _vs_peers.
      #      R&D intensity removed: it is an INPUT and mechanically depresses the very
      #      margins this group rewards (it lives in ai_capability instead). ----
      quality: [f_gross_profitability_vs_peers, f_grossMargins_vs_peers,
                f_operatingMargins_vs_peers, f_profitMargins_vs_peers,
                f_returnOnEquity_xs, f_roic_ex_intangibles_xs,
                f_fcf_margin_vs_peers, f_earnings_quality_xs,
                f_piotroski_f_score_xs]              # 9-point fundamental-health score

      # ---- GROWTH: top line, bottom line, margin trend, forward bookings ----
      growth: [f_y_rev_growth_xs, f_y_earnings_growth_xs, f_revenueGrowth_xs,
               f_earningsGrowth_xs, f_q_rev_growth_xs, f_rev_growth_accel_xs,
               f_fcf_growth_xs, f_gross_margin_chg_xs, f_operating_margin_5y_chg_xs,
               f_operating_leverage_xs, f_operating_leverage_elasticity_xs,
               f_rule_of_40_xs, f_sustainable_growth_rate_xs]

      # ---- DISTRESS: ONE leverage measure (the off-BS-inclusive one already contains
      #      leases + pension + ARO), then coverage and liquidity.
      #      Was 3/7 leverage, two of them sharing a numerator. The debt-maturity WALL
      #      members are gone with their features: the 1y/5y ladders need `debtMaturity1y`
      #      / `debtMaturity5yTotal`, which Sharadar does not deliver, so `refinancing_risk`
      #      (short-term debt vs cash + FCF) is again the only maturity signal here. ----
      #      `-f_net_debt_incl_offbs_to_ebitda_xs` was the first member until 2026-09-05.
      #      Its off-balance-sheet legs (leases, ARO) do not exist on the Sharadar
      #      substrate and the pension leg reaches 199/491 tickers, so once the distress
      #      block read the reconciled `totalDebt` the two became the SAME NUMBER --
      #      identical fingerprint hashes. The pension overhang is still represented, by
      #      the `pension` group below.
      distress: ["-f_net_debt_to_ebitda_xs",
                 f_altman_z_xs, f_ebit_interest_coverage_xs, f_interest_coverage_xs,
                 f_current_ratio_xs, f_cash_to_debt_xs,
                 "-f_refinancing_risk_xs",
                 "-f_negative_equity"]              # raw 0/1 state flag

      # ---- PENSION / RETIREMENT OVERHANG: its own group because it is populated only
      #      for DB-plan sponsors (~20-30% of the universe); inside `distress` it would
      #      change what that score means for exactly those names. ----
      pension_risk: [f_pension_funded_ratio_xs, "-f_pension_overhang_leverage_xs",
                     "-f_pbo_to_mcap_xs"]

      # ---- CAPITAL ALLOCATION: investment discipline. Share issuance moved to
      #      shareholder_return so the two stop double-counting the same dilution. ----
      capital_allocation: ["-f_asset_growth_xs",          # Cooper-Gulen-Schill (CMA)
                           "-f_acquisition_intensity_xs", "-f_intangibles_growth_xs",
                           "-f_sbc_intensity_vs_peers", "-f_sbc_to_ocf_xs",
                           "-f_da_to_capex_xs"]           # D&A > capex = under-investing

      # ---- SHAREHOLDER RETURN: yield, its safety, and NET issuance ----
      shareholder_return: [f_shareholder_yield_xs, f_dividend_yield_xs,
                           f_dividend_coverage_xs, f_dividend_growth_5y_xs,
                           f_dps_growth_xs, f_buyback_intensity_xs,
                           "-f_shares_growth_xs", "-f_diluted_shares_growth_xs",
                           "-f_option_overhang_xs"]

      # ---- ACCOUNTING QUALITY: statement integrity. Accruals were counted in THREE
      #      groups (quality, accounting_quality, eps_beat); dropped from `quality`,
      #      which now measures profitability outputs only. Still shared with eps_beat
      #      by design -- see the note there. ----
      # The special-items, useful-life, cash-tax and equity-method members went with their
      # features: every one needed a tag Sharadar does not deliver. What remains is what the
      # merged table can actually support.
      accounting_quality: ["-f_beneish_m_score_xs", "-f_accruals_xs",
                           "-f_dso_change_xs", "-f_dpo_change_xs",
                           "-f_sbc_to_buyback_xs",
                           "-f_nci_income_share_xs"]      # profit the parent does not own

      ma_digestion: [f_roic_incl_intangibles_xs,
                     f_intangibles_roic_drag_xs,       # drag = roic_incl - roic_ex is NEGATIVE;
                                                    # higher (nearer 0) = less dilution -> '+'
                     "-f_intangibles_to_assets_xs", "-f_intangibles_to_equity_xs",
                     "-f_sga_elasticity_xs", "-f_headcount_elasticity_xs"]

      # ---- AI: SPLIT IN TWO. These are OPPOSITE theses and were being averaged into
      #      one number, so they partially cancelled. `capability` = already efficient
      #      and tech-heavy (best placed to deploy); `opportunity` = labour- and
      #      overhead-heavy (most to gain). Keep both and let the model choose. ----
      # The two capitalized-software members are gone: `capitalizedSoftware` is not an SF1
      # column, so the IT-INVESTMENT leg of this thesis has no data. What is left is the
      # already-efficient / tech-heavy proxy, which is thinner than the group was designed
      # to be -- it comes back with the SEC extraction path.
      ai_capability: [f_revenue_per_employee_vs_peers, "-f_sga_intensity_vs_peers",
                      f_rd_intensity_vs_peers]
      ai_opportunity: ["-f_revenue_per_employee_vs_peers", f_sga_intensity_vs_peers,
                       f_headcount_elasticity_vs_peers, f_dso_xs]

      expectations: [f_fwd_eps_yield_xs, f_forward_earnings_yield_xs,
                     f_eps_expectation_growth_xs, f_eps_surprise_last_xs]
      # `-f_accruals_xs` is KEPT here (it also sits in accounting_quality): low accruals
      # genuinely belong to a beat-propensity thesis, and this membership was agreed
      # explicitly -- see tests/data_aggregate/test_composites.py. The only addition is
      # q_margin_vs_ttm (latest-quarter margin vs the TTM margin = margin inflecting up).
      eps_beat: [f_eps_surprise_4q_avg_xs, "-f_accruals_xs", f_earnings_quality_xs,
                 f_y_rev_growth_xs, f_margin_expansion_delta_xs, f_q_margin_vs_ttm_xs,
                 "-f_eps_expectation_growth_xs"]    # a low consensus bar is easier to clear
                                                    # (deliberately the opposite sign to
                                                    #  `expectations` -- the two are meant to
                                                    #  disagree, not to be averaged together)

      governance: [f_pct_independent_directors_xs, f_insider_ownership_pct_xs,
                   f_ceo_equity_pay_pct_xs, f_say_on_pay_support_xs, f_founder_ceo_xs,
                   "-f_ceo_pay_ratio_xs", "-f_ceo_pay_vs_revenue_growth_xs",
                   "-f_ceo_pay_growth_xs"]
      workforce: [f_revenue_per_employee_vs_peers, f_revenue_per_employee_growth_xs,
                  f_employee_growth_xs]

      # ---- OWNERSHIP FLOW: who is buying. Three separate groups because insiders,
      #      elite 13F managers and the all-filer 13F crowd are different signals. ----
      insider: [f_insider_net_buy_ratio_xs, f_insider_buy_sell_count_ratio_xs,
                f_insider_buy_count_xs, f_insider_net_buy_to_mcap_xs]
      superinvestor: [f_super_flow_to_mcap_xs, f_super_value_to_mcap_xs,
                      f_super_breadth_chg_xs, f_super_cluster_buying_xs,
                      f_super_new_buyer_ratio_xs, f_super_shares_chg_xs]
      institutional: [f_inst_flow_to_mcap_xs, f_inst_breadth_chg_xs,
                      f_inst_shares_chg_xs, f_new_buyer_ratio_xs, "-f_exiters_xs",
                      "-f_inst_concentration_xs"]   # concentrated holders = fragile ownership

      # ---- SHORT / SETTLEMENT PRESSURE: heavy shorting and rising fails are bearish ----
      short_pressure: ["-f_short_vol_ratio_xs", "-f_short_vol_ratio_chg_xs",
                       "-f_fails_to_deliver_ratio_xs", "-f_fails_to_deliver_chg_xs"]

      # ---- EARNINGS-CALL TONE (f_ec_*): positive, confident, coherent, unchanged
      #      narrative = bullish. Populated only once transcripts are ingested and
      #      scored -- currently 217 sections, so these are skipped and WARNED about. ----
      earnings_call: [f_ec_tone_xs, f_ec_tone_delta_xs, f_ec_prep_tone_delta_xs,
                      f_ec_qa_tone_delta_xs, "-f_ec_uncertainty_xs", "-f_ec_qa_gap_xs",
                      f_ec_qa_coherence_mean_xs, "-f_ec_qa_coherence_std_xs",
                      f_ec_qa_qq_sim_xs, f_ec_prep_qq_sim_xs,
                      "-f_ec_vocab_novelty_xs", "-f_ec_length_delta_xs"]

      # ---- ATTENTION: a retail-attention spike is a short-horizon reversal signal ----
      # attention: ["-f_attn_spike_xs"]

      technical: [mom_12_1, ma_ratio_50, "-vol_63", "-max_21", "-ret_skew_126",
                  "-idio_vol_63", "-downside_vol_63"]

      # ---- SECTOR-ONLY HEALTH SCORES. Deliberately separate groups: these members are
      #      NaN outside their sector, so folding them into the universal composites
      #      would make those scores mean something different for banks/insurers/REITs.
      #
      #      ⚠ `bank_health` AND `insurance_health` ARE GONE, not thinned. Sharadar SF1
      #      carries no `loans`, `deposits`Domestic, `noninterestExpense`,
      #      `provisionForCreditLosses`, `netInterestIncome`, `tier1CapitalRatio`,
      #      `nonaccrualLoans`, `netChargeOffs`, `claimsIncurred` or `premiumsWritten`, so
      #      every member of both groups measured ZERO values against the live table. A
      #      composite over one surviving member is not a health score, it is that member
      #      wearing a score's name. `f_aoci_to_equity_xs` (banks) and
      #      `f_book_value_growth_xs` (insurers) remain available as raw features. Both
      #      groups come back with the SEC extraction path. ----
      reit_health: [f_ffo_yield_xs, f_ffo_margin_vs_peers, f_affo_margin_vs_peers,
                    f_affo_dividend_coverage_xs, "-f_ffo_payout_xs"]
      energy_health: [f_ebitda_margin_vs_peers, "-f_ddna_intensity_vs_peers"]

  output:
    save_cube: true
    save_panel: false
    save_signal: true
    save_cv_results: false
    save_predictions: true
    save_shap: true
    save_models: true
