  - f_fwd_eps_yield
  - f_da_to_capex
  - f_sbc_intensity
  - f_implied_useful_life_vs_peers
  - f_implied_useful_life_xs
  - f_ic_inst_ownership_pct
  - f_ic_insider_distinct_buyers_120d
  - f_dividend_growth
  - f_sales_yield
  - f_ic_inst_shares_chg
  - f_debtToEquity
  - amihud_63
  - f_gross_profitability
  - f_capex_intensity
  - f_sga_intensity
  - f_dso_change
  - f_intangible_amortization_share_xs
  - f_y_margin_vs_ttm
  - f_asset_growth
  - f_asset_age_vs_peers
  - f_ic_super_shares_chg
