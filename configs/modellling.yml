# modellling.yml -- GENERIC / shared model config only.
# Per-model hyperparameters AND feature sets now live in their own files (merged in by
# read_config via distinct top-level keys):
#   * linear_modelling.yml  -> `linear:`  (elastic-net: hyperparams + its columns)
#   * lgbm_modelling.yml     -> `lgbm:`    (LightGBM: hyperparams + monotone + categoricals + columns)
# This split lets each model carry its own variables/tuning and makes adding a third
# family (e.g. random_forest_modelling.yml -> `random_forest:`) a drop-in.
model:
  label_column: y
  target_type: zscore          # preserve target magnitude in fitting; the assessment uses h60 only.
  ensemble: [elasticnet, lgbm, random_forest]   # families to train; per-day-standardized preds are averaged.

  models_dir: output/models    # fitted members (model_h<h>_<family>.pkl) + metadata.json, under the
                               # data store (absolute paths are used as-is)
  weight_decay:
    enabled: false             # OFF: time-decay up-weighted recent folds and WIDENED the
                               # cross-fold IC spread. Off lifts fold-IR 1.85 -> 2.50 (tighter,
                               # all-positive folds) at a small mean-IC cost -- the
                               # bias-for-consistency trade. Re-enable with ~10y (fold-IR 2.28)
                               # for a mild recency tilt in live prediction.
    half_life_years: 10
  cv:
    n_splits: 5
    embargo: null              # defaults to primary_horizon when null

  diagnostics:                 # per-run, per-horizon model-diagnosis artifacts, written to
    dependence_sample: 1000     # display only; full held-out SHAP rows stay in diagnostic artifacts
                               # data/output/diagnostics/<run_stamp>/h<H>/ for EVERY booster
                               # member of `ensemble` (lgbm, random_forest -- linear members
                               # have no SHAP/PDP): pdp/, shap_values.parquet (the raw per-row
                               # matrix, keyed by date+ticker), shap_importance.png/.csv,
                               # feature_importance.xlsx, plus kpis.json per horizon and a flat
                               # kpis.csv for the run.
    enabled: true
    top_n_features: 50         # top features rendered as individual PDPs + SHAP bar
    shap_sample: 12000         # rows sampled for SHAP / partial dependence (speed). Also the
                               # row count of shap_values.parquet, per member per horizon.
    pdp_grid: 30               # partial-dependence grid resolution
    pdp_background: 2000
    rolling_window: 252
    bootstrap_repetitions: 1000
    confidence: 0.95

  assessment:
    horizon: 60
    outcome_cutoff: 2021-12-31
    evaluation_start: 2022-01-03
    test_windows:
    - [2000-01-01, 2002-12-31]
    - [2003-01-01, 2006-12-31]
    - [2007-01-01, 2012-12-31]
    - [2013-01-01, 2018-12-31]
    - [2019-01-01, 2021-12-31]
    prune_fraction: 0.20
    max_rounds: 10
    patience: 2
    read_chunksize: 25000      # I/O batching only; no change to fitting rows or model parameters.
    categorical_features: [sector, industry_group]
    excluded_columns: [open, high, low, close, close_split, close_total, level_factor, volume]
    diagnostic_periods:
      dotcom_2000_2002: [2000-01-01, 2002-12-31]
      gfc_2007_2009: [2007-01-01, 2009-12-31]
      '2019': [2019-01-01, 2019-12-31]
      covid_2020: [2020-01-01, 2020-12-31]
      '2022': [2022-01-01, 2022-12-31]
      '2023': [2023-01-01, 2023-12-31]
    comparison_years: [2018, 2019]

  backtest:                    # label-only quantile backtest of each horizon's OOS CV predictions,
    enabled: false            # training-only checks; portfolio backtest remains a separate DAG task
                               # the last stage of training (diagnostics/<run_stamp>/h<H>/backtest_*)
    n_quantiles: 10            # buckets per date; top-minus-bottom = the dollar-neutral spread

train:
  start_date: 1999-01-01
  end_date: 2022-01-01
