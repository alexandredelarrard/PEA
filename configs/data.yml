# Source work, publication clocks, and per-cube input history.
# Extraction start_date values remain unchanged. Cube dates come from prices.
# Numeric overlap: latest saved reference date minus days, through the run date.
# PIT: source column plus calendar lag_days, then first open US market session.
# warmup: input table -> additional calendar days before the cube rewrite start.
# warmup null means full stored history; 0 means the output interval only.
# Numeric warmups are conservative proposals, subject to sampled boundary checks.

