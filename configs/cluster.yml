# Manager clustering and the per-cluster 13F cube features (StepManagerProfile.run_clustering, StepCubeSecThirteen).
cluster:
  fit: false                 # true refits k-means on the full history (run locally once, then set back to false); false only labels rows
  centroids_path: cluster_centroids.json  # fitted centroids, a file in configs/ that the nightly run only reads
  k: 10                      # k-means clusters fitted on fund managers (e.g. 8-12)
  keep: 7                    # fitted clusters kept after the exclude rule; must equal the number left (e.g. 6-8)
  seed: 0                    # seed of the row sample and of k-means (any integer)
  n_init: 30                 # k-means restarts, the best inertia is kept (e.g. 10-50)
  max_rows_per_quarter: 2000 # fit rows drawn per report quarter so recent, larger quarters do not dominate (e.g. 1000-5000)
  fit_filters: {category: fund, min_positions: 4, min_book_usd: 20000000}  # size floor: a row with fewer positions or a smaller USD book is labelled -1 (every category); a fund at or above it is clustered
  features:                  # clustering inputs, z-scored with equal weight; `rank` = percentile rank within the quarter; no return column is allowed
    - pct_cap_small          # share of the book in small caps
    - pct_cap_mid            # share in mid caps
    - pct_cap_large          # share in large caps
    - pct_equity_us          # share in US equities
    - pct_equity_foreign     # share in foreign equities
    - pct_etf                # share in ETFs and funds
    - active_share           # distance to the aggregate 13F weights (0 = index-like)
    - {name: book_value_usd, transform: rank}  # size of the book, ranked within the quarter
    - {name: hhi, transform: rank}             # concentration, ranked within the quarter
    - {name: turnover, transform: rank, optional: true}  # share of positions changed, ranked within the quarter; null on a manager's first row, so a null leaves it out of that row's distance
  exclude: {pct_etf: 0.40, pct_equity_foreign: 0.40}  # fitted clusters whose centroid has pct_etf or pct_equity_foreign at or above these shares are dropped from the kept fund ids and take a tracked id (e.g. 0.30-0.50)
  cluster_label_delay_days: 90   # a quarter is labelled once period + this many days has passed (e.g. 90)
  top_x: null                # keep only the top-X managers of a cluster; null keeps every member (no code reads it yet; the key is kept on purpose)
  history_start: 2000-01-01  # first date of the cluster features (YYYY-MM-DD)
  availability_buffer_days: 7    # days added to the 45-day filing deadline before a quarter's features are published (e.g. 0-14)
  max_age_calendar_days: 100     # a quarter's values are carried at most this many days after its publication (e.g. 92-130)
  consistency_tolerance: 1.0e-6  # largest difference allowed when the newest saved quarter is recomputed before an incremental run
  max_clusters: 11           # more clusters than this logs a WARNING about the column count
  max_features_per_cluster: 10   # more features in one cluster than this logs a WARNING about the column count
  stability:                 # acceptance thresholds of the stability check against the research partition (read by the run-directory script _scripts/stability.py, not by src)
    min_ari: 0.70            # adjusted Rand index between two partitions (e.g. 0.6-0.9)
    min_jaccard: 0.50        # best Jaccard overlap of each kept cluster with a research cluster (e.g. 0.4-0.7)
    min_persistence: 0.85    # share of managers keeping their cluster from one quarter to the next (e.g. 0.8-0.95)
    min_share: 0.03          # smallest share of fund rows in a kept cluster (e.g. 0.02-0.05)
    max_share: 0.25          # largest share of fund rows in a kept cluster (e.g. 0.2-0.35)
  clusters:                  # features per cluster; fund clusters take ids 0..keep-1, categories have fixed ids
    fund:          {features: [net_breadth, new_position_rate, net_share_flow, top10_chg, rank_gap, rank_gap_chg, stickiness, cap_proximity], min_holders: 8}  # each fund cluster; min_holders = managers needed to hold or exit a stock for a value (e.g. 4-12)
    bank:          {id: 7,  features: [net_breadth, new_position_rate, net_share_flow, top10_chg, rank_gap, rank_gap_chg, stickiness, option_intensity], min_holders: 8}  # banks, id 7
    insurance:     {id: 8,  features: [net_breadth, new_position_rate, net_share_flow, top10_chg, rank_gap, rank_gap_chg, stickiness, flow_x_vol], min_holders: 4}  # insurers, id 8
    broker_dealer: {id: 9,  features: [net_breadth, new_position_rate, net_share_flow, top10_chg], min_holders: 5}  # broker-dealers, id 9
    pension:       {id: 10, features: [net_breadth, new_position_rate, net_share_flow, top10_chg], min_holders: 4}  # pension funds, id 10
  # The fund names (ids 0-6 and 11-13) and their centroid values describe the saved fit e8902b2797034b31: re-read them after every refit.
  labels:                    # the name behind every stored `cluster` id; features: true = the cube builds feature columns for it (the `clusters` block); the code reads ids, tracked ids and rules, names are for people
    - {id: -2, name: not_computable, features: false}    # fund at or above the size floor with a required clustering feature null (turnover alone is optional)
    - {id: -1, name: below_size_floor, features: false}  # any row below fit_filters (positions or book), whatever its category
    - {id: 0, name: fund_large_cap_low_turnover, features: true}  # kept fund clusters 0..keep-1 by descending fit size, named from the saved centroids; large caps 0.77, US 0.88, active share 0.80, small book (rank 0.32), turnover rank 0.24
    - {id: 1, name: fund_mixed_cap_concentrated_high_turnover, features: true}  # small 0.27 / mid 0.29 / large 0.42, US 0.74, active share 0.95, small book (rank 0.32), hhi rank 0.70, turnover rank 0.80
    - {id: 2, name: fund_large_cap_big_book, features: true}  # large caps 0.75, US 0.88, active share 0.89, big book (rank 0.76), hhi rank 0.58, turnover rank 0.53
    - {id: 3, name: fund_large_cap_low_concentration, features: true}  # large caps 0.73, US 0.86, index-like active share 0.60, big book (rank 0.81), hhi rank 0.13
    - {id: 4, name: fund_mixed_cap_diversified_high_turnover, features: true}  # small 0.32 / mid 0.35 / large 0.32, US 0.87, active share 0.89, big book (rank 0.72), hhi rank 0.20, turnover rank 0.70
    - {id: 5, name: fund_small_cap, features: true}  # small caps 0.77, US 0.76, active share 0.99, hhi rank 0.69, turnover rank 0.56
    - {id: 6, name: fund_mid_cap_concentrated, features: true}  # mid caps 0.52, US 0.86, active share 0.98, hhi rank 0.74, turnover rank 0.49
    - {id: 7, name: bank, features: true}             # feature categories: the id and the name are those of the `clusters` block
    - {id: 8, name: insurance, features: true}
    - {id: 9, name: broker_dealer, features: true}
    - {id: 10, name: pension, features: true}
    - {id: 11, name: fund_etf_heavy, features: false, dropped_by: pct_etf}            # tracked only: the dropped fund cluster with the highest centroid pct_etf (the ids go by the centroid value of the rule, never by fit size); saved fit: pct_etf 0.85, US 0.11
    - {id: 12, name: fund_etf_mixed, features: false, dropped_by: pct_etf}            # the next dropped cluster by pct_etf; saved fit: pct_etf 0.51, US 0.43, large caps 0.55
    - {id: 13, name: fund_foreign_heavy, features: false, dropped_by: pct_equity_foreign}  # dropped by the foreign rule (highest pct_equity_foreign first); saved fit: foreign 0.62, US 0.30
    - {id: 14, name: sovereign, features: false, category: sovereign}  # tracked only: manager category with no fund clustering and no features
    - {id: 15, name: other, features: false, category: other}
