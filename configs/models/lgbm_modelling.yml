# lgbm_modelling.yml -- LightGBM member: hyperparameters + its OWN feature set + monotone.
# Merged into the global config by read_config (distinct top-level key `lgbm`). Robust
# recipe chosen on cross-fold IC stability (foldIR): lr .02, min_child 100, eval=rmse,
# monotone ON. Keeps the sparse sector-specific + earnings-call columns --
# LightGBM handles NaN/sparsity natively.
lgbm:
  task: regression             # regression | classification (classification needs a {0,1} label)
  learning_rate: 0.01
  max_depth: 5
  num_leaves: 31
  subsample: 0.8
  bagging_freq: 1
  colsample_bytree: 0.8
  min_child_samples: 120
  lambda_l1: 5.0
  lambda_l2: 5.0
  num_boost_round: 3000
  early_stopping_rounds: 100
  eval_metric: rmse
  categoricals:
  - industry_group
  - sector
  monotonic:
    enabled: true
    features:
    - f_reported_expected_eps_yield: 1
    - f_intangibles_to_assets: -1
    - f_pct_independent_directors: 1
    - ma_ratio_200: -1
    - ma_ratio_50: -1
    - rsi_14: -1
    - f_ceo_pay_vs_revenue_growth: 1
    - f_earnings_sue_lag3: -1
    - f_auditor_vote_dissent: -1
    - f_y_rev_growth_accel: 1
    - f_sustainable_growth_rate: 1
    - f_option_overhang: 1
    - f_fcf_to_ev_vs_peers: 1
    - f_returnOnEquity: 1
    - f_board_dissent_median: 1
    - f_accruals_ratio: -1
    - f_reported_expected_eps_growth_qoq: -1
    - f_diluted_shares_growth: -1
    - f_director_equity_pay_pct_vs_peers: 1
    - f_dividend_growth: 1
    - f_book_yield: -1
    - f_board_tenure_dispersion: -1
    - f_payout_ratio: 1
    - f_board_dissent_breadth_20_vs_peers: 1
    - f_rd_capitalized_roic: 1
    - f_days_since_earnings: 1
    - f_auditor_tenure: 1
    - f_shareholder_yield: 1
    - f_oldest_director_age: -1
    - f_log_ceo_total_comp: 1
    - f_avg_board_tenure_vs_hist: 1
    - f_dso_vs_hist: 1
    - f_gmroi_vs_hist: 1
    - f_fcf_margin_vs_hist: 1
    - f_capex_to_dep: -1
    - f_sales_yield_vs_hist: -1
    - f_insider_ownership_pct: -1
    - f_ebitda_to_ev_vs_hist: 1
    - f_intrinsic_yield: 1
    - f_ceo_pay_slice_delta_1y: 1
    - f_eps_surprise_4q_avg: 1
    - f_ocf_yield : 1

  columns:
  # FIN vars
  - f_revenue_cagr_3y
  - f_y_earnings_growth_signed
  - f_cash_runway_months
  - f_reported_expected_eps_yield
  - f_intangibles_to_assets
  - f_earnings_sue_lag4 # delta Net Income vs 4q / std earnings 8q
  - f_y_rev_growth_accel
  - f_sustainable_growth_rate
  - f_option_overhang # to check: why more actions leads to higher value ?
  - f_fcf_to_ev_vs_peers
  - f_returnOnEquity
  - f_accruals_ratio
  - f_gross_profitability
  - f_revenue_per_employee # to normalize to have it as % of revenue per employee
  - f_reported_expected_eps_growth_qoq # -1 trend , why ?
  - f_diluted_shares_growth  # significant, but weird N shape ??
  - f_dividend_growth
  - f_book_yield
  - f_payout_ratio
  - f_rd_capitalized_roic
  - f_days_since_earnings
