# lgbm_modelling.yml -- LightGBM member: hyperparameters + its OWN feature set + monotone.
# Merged into the global config by read_config (distinct top-level key `lgbm`). Robust
# recipe chosen on cross-fold IC stability (foldIR): lr .02, min_child 100, eval=rmse,
# monotone ON. Keeps the sparse sector-specific + earnings-call columns --
# LightGBM handles NaN/sparsity natively.
lgbm:
  learning_rate: 0.01
  max_depth: 5
  num_leaves: 31
  subsample: 0.8
  bagging_freq: 1
  colsample_bytree: 0.8
  min_child_samples: 100
  lambda_l1: 5.0
  lambda_l2: 5.0
  num_boost_round: 3000
  early_stopping_rounds: 100
  eval_metric: rmse
  categoricals:
  - industry_group
  monotonic:
    enabled: true
    features:
    - amihud_63: 1
    - vol_63: -1
    - f_y_rev_growth: 1
    - f_operating_margin_5y_chg: 1
    - f_operating_leverage: 1
    - f_revenue_per_employee_growth: 1
    - f_acquisition_intensity: -1
    - f_ebitda_to_ev: 1
    - f_pegy: -1
    - f_core_earnings_yield_xs: 1
    - f_nonrecurring_pretax_share_xs: -1
    - f_gross_profitability: 1
    - f_rd_intensity: 1
    - f_capitalized_software_intensity_vs_peers: 1
    - f_shareholder_yield: 1
    - f_da_to_capex: -1
    - f_shares_growth: -1
    - f_sbc_to_ocf: -1
    - f_dividend_growth_5y: 1
    - f_interest_coverage: 1
    - f_net_debt_to_ebitda: -1
    - f_refinancing_risk: -1
    - f_ic_insider_net_buy_ratio_180d: 1
    - f_tier1_capital_ratio_xs: 1
    - f_combined_ratio_xs: -1
    - mom_12_1: 1
    - max_21: -1
    - f_ic_inst_flow_to_mcap_xs: 1
    - f_ic_super_flow_to_mcap_xs: 1
    - f_ic_shortvol_ratio_20d_vs_peers: -1
    - f_ic_shortvol_acceleration: -1
    - f_ic_ftd_to_adv20_xs: -1
    - f_ec_tone: 1
    - f_ec_tone_vs_hist: 1
    - f_ec_tone_delta: 1
    - f_ec_uncertainty: -1
    - f_ec_uncertainty_vs_hist: -1
    - peer_mom_63: 1
    - f_piotroski_f_score: 1
    - f_rule_of_40: 1
    - f_rpo_growth_xs: 1
    - f_book_value_growth: 1
    - f_premium_growth_xs: 1
    - f_float_growth_xs: 1
    - f_affo_dividend_coverage: 1
    - f_nii_growth_xs: 1
    - f_ic_super_initiations_xs: 1
    - f_q_margin_vs_ttm: 1
    - f_eps_expectation_growth: 1
    - f_intrinsic_yield: 1
    - f_goodwill_intangibles_to_assets_vs_peers: -1
    - f_fcf_to_ev: 1
    # ⚠ f_ceo_tenure_vs_peers and f_pct_female_directors_vs_peers REMOVED 2026-09-08,
    # from this list and from `columns` below. Both were monotone +1, and both features'
    # information coefficient FLIPS SIGN between halves of the sample under all three
    # encodings (ceo_tenure peer: -0.0062 in 2011-18, +0.0213 in 2019-26) -- a monotone
    # constraint asserts a direction the data does not hold. They now ship raw as
    # f_ceo_tenure / f_pct_female_directors; re-add on SHAP evidence, not on priors.
