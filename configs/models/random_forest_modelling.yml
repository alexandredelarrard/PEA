# random_forest_modelling.yml -- Random Forest member (merged via read_config, key `random_forest`).
# Implemented as LightGBM in `boosting: rf` mode: bagged, INDEPENDENT trees (no boosting) --
# so it handles the cube's NaNs + native categoricals + monotone constraints, unlike sklearn's
# RandomForest (which needs imputation + one-hot). Select inputs in columns/columns_by_horizon;
# lgbm.categoricals assigns their types and lgbm.monotonic supplies directions at every horizon.
# Add "random_forest" to model.ensemble in modellling.yml to include it in the blend.
random_forest:
  task: regression             # regression | classification (classification needs a {0,1} label)
  boosting: rf
  num_boost_round: 500         # number of bagged trees (RF: more trees lower variance, no overfit)
  bagging_fraction: 0.7        # row subsample per tree (REQUIRED for rf mode, with bagging_freq>0)
  bagging_freq: 1
  feature_fraction: 0.7        # column subsample per tree -> decorrelates the trees
  max_depth: 8                 # fuller trees than the GBDT; variance averaged out by bagging
  num_leaves: 127
  min_child_samples: 100
  lambda_l1: 2.0
  lambda_l2: 2.0

  # Complete default feature list, including selected categorical inputs.
  # Used for ANY horizon that has no entry under columns_by_horizon.
  categoricals:
  - industry_group
  - sector
  # Shared by LGBM and RF at all horizons, aligned to selected fitted inputs.
  monotonic:
    enabled: true
    features:
    # - f_reported_expected_eps_yield: 1   # OFF: linear sign opposite (coefficient and cluster net effect)
    - f_intangibles_to_assets: -1
    - f_pct_independent_directors: 1
    # - ma_ratio_200: -1   # OFF: linear sign opposite (coefficient and cluster net effect)
    - ma_ratio_50: -1
    - rsi_14: -1
    # - f_ceo_pay_vs_revenue_growth: 1   # OFF: sign differs between horizons; against literature: excess CEO pay growth -> agency cost -> negative (Bebchuk-Fried; Core et al.)
    # - f_earnings_sue_lag3: -1   # OFF: against literature: SUE autocorrelation is positive at lags 1-3 (Bernard-Thomas); linear sign opposite (coefficient and cluster net effect)
    - f_auditor_vote_dissent: -1
    # - f_y_rev_growth_accel: 1   # OFF: linear sign opposite (coefficient and cluster net effect)
    - f_sustainable_growth_rate: 1
    # - f_option_overhang: 1   # OFF: sign differs between horizons; against literature: option overhang = future dilution -> negative (Core; Pontiff-Woodgate); linear sign opposite (coefficient and cluster net effect)
    # - f_fcf_to_ev_vs_peers: 1   # OFF: sign differs between horizons
    - f_returnOnEquity: 1
    - f_board_dissent_median: 1
    - f_accruals_ratio: -1
    - f_reported_expected_eps_growth_qoq: -1
    # - f_diluted_shares_growth: -1   # OFF: linear sign opposite (coefficient and cluster net effect)
    - f_director_equity_pay_pct_vs_peers: 1
    - f_dividend_growth: 1
    # - f_book_yield: -1   # OFF: against literature: book-to-market value premium is positive (Fama-French); linear sign opposite (coefficient and cluster net effect)
    - f_board_tenure_dispersion: -1
    - f_payout_ratio: 1
    - f_board_dissent_breadth_20_vs_peers: 1
    - f_rd_capitalized_roic: 1
    - f_days_since_earnings: 1
    - f_auditor_tenure: 1
    - f_shareholder_yield: 1
    - f_oldest_director_age: -1
    # - f_log_ceo_total_comp: 1   # OFF: sign differs between horizons; against literature: overpaid CEOs underperform (Cooper-Gulen-Rau); linear sign opposite (coefficient and cluster net effect)
    - f_avg_board_tenure_vs_hist: 1
    # - f_dso_vs_hist: 1   # OFF: against literature: receivables build vs history -> lower returns (Sloan/Thomas-Zhang accrual family)
    - f_gmroi_vs_hist: 1
    - f_fcf_margin_vs_hist: 1
    - f_capex_to_dep: -1
    # - f_sales_yield_vs_hist: -1   # OFF: against literature: cheaper than own history (higher sales yield) -> positive value signal; linear sign opposite (coefficient and cluster net effect)
    - f_insider_ownership_pct: -1
    # - f_ebitda_to_ev_vs_hist: 1   # OFF: sign differs between horizons
    - f_intrinsic_yield: 1
    # - f_ceo_pay_slice_delta_1y: 1   # OFF: against literature: rising CEO pay slice -> entrenchment, lower value (Bebchuk-Cremers-Peyer)
    - f_eps_surprise_4q_avg: 1
    # - f_ocf_yield: 1   # OFF: linear sign opposite (coefficient and cluster net effect)

