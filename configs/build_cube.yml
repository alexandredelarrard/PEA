build_cube:
  # No market_ticker: the market reference is a SERIES in `prices_macro`, identified by name
  # (constants.MACRO_MARKET_SERIES), not a configurable ticker symbol in `prices`.

  betas:                       # rolling multi-factor loadings epsilon is residualized on
    window: 126                # trailing estimation window (trading days). Was 63: at that
                               # length the cross-sectional slope of the REALIZED in-window
                               # beta on the ex-ante one is only 0.43, i.e. 57% of the beta's
                               # dispersion is noise and the hedge over-shoots by that much.
    min_obs: 80                # observations needed before a beta is emitted (scaled with window)
    ridge_alpha: 1.5           # shrinkage RATIO: lambda = ridge_alpha * N, so an orthogonal
                               # factor is shrunk by 1/(1+alpha) at EVERY window length.
    ridge_alpha_market: 0.48   # market's OWN ratio: it shrinks toward 1.0 rather than 0.0 and
                               # forecasts its window far better than the macro loadings do,
                               # so it needs much less. 
    market_prior: 1.0          # beta_market shrinks toward 1.0 (its natural centre)
    step: 1                    # re-fit every N days. 1 = daily => no 5-day staircase
    ffill_limit: 21            # carry a beta at most N days over a gap with no estimable window

  targets:
    horizons: [30, 60, 90]
    primary_horizon: 60
    labels: [rank, zscore, epsilon]   
    min_names: 20
    # Every label is finally PROJECTED cross-sectionally orthogonal to EVERY fitted loading +
    # momentum + log market cap + GICS industry_group indicators, jointly and AFTER the
    # rank/zscore transform. Subtracting beta*factor is not enough on its own: a signal built
    # from nothing but a name's market beta earned rank-IC +0.073 (t +10.3) against the
    # un-projected label. The loading list is DERIVED from the fitted betas (see
    # `targets.fitted_beta_columns`) rather than listed here: a hand-kept list let a newly
    # added factor's loading leak into the label until somebody remembered to edit it, and the
    # loadings that had been left out were measured to leak no more than the ones left in.
    neutralize_momentum: true  # ALSO project out the 12-1 momentum CHARACTERISTIC. This zeroes
                               # the mom_12_1 feature's own IC by construction -- deliberate for
                               # a cheap price-based risk premium, and exactly why the value and
                               # vol characteristics are NOT treated the same way.
    neutralize_log_mcap: true  # ALSO project out log market cap. `beta_size` is a LOADING on the
                               # size factor's RETURN and does not span the size CHARACTERISTIC
                               # (R^2 0.26 across names, 59% of the size ordering unspanned by
                               # the whole design), so `-log_mcap` earned free rank-IC
                               # +0.0254/+0.0380/+0.0443 at h=30/60/90 (t up to +7.4); this takes
                               # h=60 to +0.0051. Un-shrinking beta_size is NOT a substitute -- a
                               # deliberate 5x over-hedge still leaves t +4.4 while injecting
                               # beta noise. vol_63 stays OUT: it would zero the vol_63 feature.
                               # Unlike the beta/sector tilts, a size tilt is neutralized nowhere
                               # downstream (strategy_ls.yml enforces beta+sector only), so it
                               # would flow straight into the live book.
    vol_standardize: true     # divide epsilon by its own trailing risk

  features:
    standardize_method: rank # rank | zscore

  intrinsic:                 # two-stage DCF for the intrinsic-value features
    discount_rate: 0.10      # equity discount rate r
    terminal_growth: 0.025   # perpetuity growth g_term (must be < r)
    years: 5                 # explicit high-growth stage length
    growth_cap: 0.15         # winsorize the firm's own growth used in the DCF
    growth_floor: -0.10

  institutionals:            # informed-capital panels (13F, insider, 13D/G, short flow)
    decay_halflife:          # trading days for the exponential event-decay transform.
                             # An EVENT is 0 on ~99.9% of ticker-days, and a peer basket of
                             # all-zeros has zero dispersion -> `peer_relative` returns NaN by
                             # policy, so the undecayed flag is an ABSENT feature. Decay is
                             # what makes these signals survive peer-relativization.
      super: 63              # one quarter: elite 13F conviction, refreshed quarterly anyway
      inst: 63               # one quarter: matches the 13F reporting cadence
      insider: 63            # one quarter: Form 4 information is stale well inside a year
      act: 126               # two quarters: an activist campaign plays out over months, not
      bo: 126                # weeks -- same for a buyout/13D approach, so both decay slower

    superinvestor:           # elite-manager (Dataroma roster) 13F panel
      stale_quarters: 4      # quarters after a manager's last PUBLIC filing before their
                             # book stops counting. A 13F filer silent for a year has
                             # deregistered or fallen under the $100M threshold; without
                             # this they stay a phantom holder in every name they ever
                             # owned, and 23 roster managers are in exactly that state.

      # Point-in-time manager selection on CONCENTRATION (plan D3b / Phase 2.2b).
      # `sel(m, q)` in [0,1] multiplies EVERY elite aggregate, so this decides what
      # `ic_super_holders` and friends actually mean:
      #
      #   "off"      sel = 1.0 for everyone -> "how many of the ~50 roster managers hold
      #              this name". No selection; the behaviour before 2.2b.
      #   top_k      sel = 1.0 for the k most concentrated managers public at that date,
      #              0 otherwise -> "how many of the k most concentrated hold this".
      #              ⚠ ALSO CHANGES COVERAGE, AND THE COST IS LARGE, NOT MARGINAL: a name
      #              held only by managers outside the top k has no counted holder and
      #              leaves the panel rather than reading 0. TWO coverage numbers, and
      #              they differ by 4x, so quote the right one:
      #                * FRESH holdings -- ticker-quarters with a top-k manager filing that
      #                  quarter: 38/quarter against 398 under "off", 11%, 230 of 488 names
      #                  ever, and the absent 89% carry 56% of the elite dollars.
      #                * PANEL WIDTH -- in-universe tickers actually non-NaN on a given
      #                  date, which is what a model sees: median 262 of 488 at the
      #                  configured k=20, against 430 under "off" (61%). k=15 gives 195 and
      #                  k=25 gives 313. `stale_quarters: 4` keeps a name live for a year
      #                  after its last selected holder filed, so the panel is far wider
      #                  than the fresh-filing count suggests.
      #              The second number is the one that matters for `_xs` and for how many
      #              names the model can score. `k` is the dial -- see the ladder below.
      #   continuous sel = the concentration percentile itself -> "how concentrated are
      #              this name's backers". Discards nobody, keeps the gradient, and is the
      #              better shape for a boosted model.
      #
      # ⚠ QUOTE "off". PyYAML is YAML 1.1, where bare `off`/`no`/`on` parse as BOOLEANS.
      #
      # ⚠ TURNING THIS ON CHANGES EVERY `ic_super_*` VALUE (plan D8). What it buys, measured
      # over 58 quarterly rebalances on the corrected pool (roster as published at `q`,
      # filings read only once public): the top-15 concentrated consensus basket returns
      # -0.32%/yr, i.e. it does NOT beat the equal-weight index -- the +3.41%/yr in README
      # Finding 4(d) was two thirds manager survivorship and one third look-ahead. What
      # survives is a ~1.8pp/yr SPREAD over the least-concentrated control, which is what a
      # cross-sectional feature needs and what this weight is for.
      selection:
        mode: top_k          # "off" | top_k | continuous. ⚠ `continuous` is what the
                             # evidence alone would pick -- a hard cut asserts a cliff
                             # between manager k and k+1 and the measurement shows a
                             # gradient. `top_k` is a deliberate choice for an
                             # INTERPRETABLE aggregate ("how many of the 15 most
                             # concentrated hold this") over a marginally better-shaped one.
        k: 20                # top_k only. Measured coverage ladder (tickers/quarter median,
                             # % of `off` ticker-quarters, names ever covered, and the
                             # within-quarter Spearman of the weighted book against `off`):
                             #    k= 5    6   1.3%   53 names  rho 0.34
                             #    k=10   20   5.2%  146 names  rho 0.20
                             #    k=15   38  10.0%  230 names  rho 0.25
                             #    k=20   68  16.5%  303 names  rho 0.61   <- here
                             #    k=30  146  33.7%  392 names  rho 0.72
                             #    k=60  360  83.7%  485 names  rho 0.94
                             # rho stays low up to k~20 because the cut genuinely REORDERS
                             # the cross-section rather than just thinning it -- which is
                             # the point of selecting, and also why k trades signal
                             # distinctiveness against how much of the universe is scored.
        min_quarters: 4      # prior filings before a manager may be scored; a two-quarter
                             # concentration estimate is noise. Free: -0.32% -> -0.27%.
        min_positions: 0     # universe positions required. ⚠ 0 ON PURPOSE, not the 3 the
                             # plan proposed: gating on the index sleeve while scoring the
                             # whole book costs 1.3pp/yr and collapses the top-minus-bottom
                             # spread from +1.97pp to +0.63pp. Raise it only alongside a
                             # slice-basis score.

    coverage_break_pct: 0.50 # D17. A quarter-on-quarter move larger than this in the
                             # universe-wide 13F FILER COUNT is a coverage discontinuity, not
                             # a market event, and every QoQ delta that quarter is nulled.
                             # ⚠ MEASURED ON THE 2026-09-11 FULL BUILD (22,498,267 rows), it
                             # fires on 11 quarters, with these filer counts:
                             #   2002-03-31    2   2013-03-31   192   2024-03-31  6,655
                             #   2006-12-31    5   2013-06-30 3,046   2025-06-30    254 HOLE
                             #   2008-12-31    9   2023-12-31   463   2025-09-30  7,297
                             #   2009-12-31   17                HOLE
                             #   2012-12-31  107
                             # SEVEN of the eleven sit at or before the D16 delta floor
                             # (2013-09-30) and are already nulled by it, so the guard only
                             # removes a value the floor had not removed on FOUR: 2023-12-31,
                             # 2024-03-31, 2025-06-30, 2025-09-30 -- the two broken quarters
                             # and the recovery quarter after each. The two HOLES have their
                             # LEVELS suppressed as well, because a delta against a hole reads
                             # as the whole universe initiating at once.

    excursion_lookback: 252  # trading days. Caps `ic_sig_insider_max_dd_since_buy` /
                             # `_max_runup_since_buy`: an excursion measured since a purchase
                             # filed nine years ago describes the decade, not the insider.
                             # ⚠ THIS IS THE BINDING LOOK-BACK OF THE WHOLE PART -- raising it
                             # requires raising `cube_part_institutionals.warmup_trading_days`
                             # in `parts.py` (390 today), which `test_part_registry.py`
                             # enforces rather than trusting.

  hist:                      # self-history (valuation mean-reversion) window for
                             # the f_<yield>_vs_hist features ("cheap vs own past")
    window: 1260             # ~5 trading years of trailing daily observations
    min_periods: 252         # need >= 1y of history before emitting a z-score

  output:
    save_cube: true
    save_panel: false
    save_signal: true
    save_cv_results: false
    save_predictions: true
    save_shap: true
    save_models: true
