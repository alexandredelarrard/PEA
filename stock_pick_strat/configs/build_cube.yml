build_cube:
  market_ticker: SPY

  betas:
    window: 63
    min_obs: 40
    shrink_weight: 0.7

  targets:
    horizons: [30, 60, 90]
    primary_horizon: 60
    labels: [rank, zscore]   # target versions STORED in the cube (rank | zscore | epsilon);
                             # the model picks one via model.target_type in modellling.yml
    min_names: 20
    neutralize_momentum: true  # orthogonalize target vs 12-1 momentum characteristic

  features:
    standardize_method: rank # rank | zscore

  intrinsic:                 # two-stage DCF for the intrinsic-value features
    discount_rate: 0.10      # equity discount rate r
    terminal_growth: 0.025   # perpetuity growth g_term (must be < r)
    years: 5                 # explicit high-growth stage length
    growth_cap: 0.15         # winsorize the firm's own growth used in the DCF
    growth_floor: -0.10

  hist:                      # self-history (valuation mean-reversion) window for
                             # the f_<yield>_vs_hist features ("cheap vs own past")
    window: 1260             # ~5 trading years of trailing daily observations
    min_periods: 252         # need >= 1y of history before emitting a z-score

  composites:                # thematic COMPOSITE signals (comp_<theme>). ADDITIVE:
                             # raw features are KEPT; composites are extra columns
                             # (no information lost). A '-' prefix inverts a member
                             # so every member reads "higher = long side" before the
                             # NaN-tolerant average. Members absent from the cube are
                             # skipped. See utils/composites.py.
    enabled: true
    method: zscore           # zscore | rank (per-day cross-sectional standardization)
    groups:
      value: [f_sales_yield_xs, f_book_yield_xs, f_fcf_yield_xs, f_ebitda_to_ev_xs,
              f_intrinsic_yield_xs, f_core_earnings_yield_xs, f_sales_yield_vs_hist,
              f_book_yield_vs_hist, f_ebitda_to_ev_vs_hist, f_intrinsic_yield_vs_hist,
              f_core_earnings_yield_vs_hist]   # core_earnings_yield = one-off-adjusted E/P
      quality: [f_grossMargins_xs, f_operatingMargins_xs, f_profitMargins_xs,
                f_returnOnEquity_xs, f_gross_profitability_xs, f_fcf_margin_xs,
                "-f_accruals_vs_peers", f_rd_intensity_xs]
      growth: [f_revenueGrowth_xs, f_earningsGrowth_xs, f_y_rev_growth_xs,
               f_y_earnings_growth_xs, f_operating_leverage_xs, f_gross_margin_chg_xs]
      distress: ["-f_net_debt_to_ebitda_xs", "-f_net_debt_incl_offbs_to_ebitda_xs",
                 f_interest_coverage_xs, f_current_ratio_xs,
                 f_cash_to_debt_xs, "-f_debtToEquity_xs"]   # off-BS = +leases +pension deficit
      capital_allocation: ["-f_sbc_intensity_xs", "-f_sbc_to_ocf_xs", "-f_shares_growth_xs",
                           "-f_acquisition_intensity_xs", "-f_goodwill_growth_xs"]
      expectations: [f_fwd_eps_yield_xs, f_eps_expectation_growth_xs]
      governance: [f_pct_independent_directors_xs, f_insider_ownership_pct_xs,
                   f_ceo_equity_pay_pct_xs, "-f_ceo_pay_ratio_xs",
                   "-f_ceo_pay_vs_revenue_growth_xs"]
      workforce: [f_revenue_per_employee_xs, f_employee_growth_xs]
      eps_beat: [f_eps_surprise_4q_avg_xs, "-f_accruals_xs", f_earnings_quality_xs,
                 f_y_rev_growth_xs, f_margin_expansion_delta_xs,
                 "-f_eps_expectation_growth_xs"]   # beat-propensity: surprise persistence +
                                                   # quality + top-line/margin momentum, less the bar
      # ---- business-quality themes (higher = cleaner books / better digestion /
      #      better AI-adoption position). Members absent until re-fetch (goodwill
      #      impairment, capitalized software) are skipped automatically. ----
      accounting_quality: ["-f_beneish_m_score_xs", "-f_nonrecurring_pretax_share_xs",
                           "-f_dso_change_xs", "-f_dpo_change_xs",
                           "-f_useful_life_change_xs", "-f_sbc_to_buyback_xs"]
      ma_digestion: [f_roic_incl_goodwill_xs, f_goodwill_roic_drag_xs,
                     "-f_goodwill_intangibles_to_assets_xs", "-f_goodwill_to_equity_xs",
                     "-f_sga_elasticity_xs", "-f_headcount_elasticity_xs",
                     "-f_goodwill_impairment_intensity_xs"]
      ai_leverage: [f_sga_intensity_vs_peers, "-f_revenue_per_employee_vs_peers",
                    f_rd_intensity_vs_peers, f_capitalized_software_intensity_vs_peers]
      technical: [mom_12_1, ma_ratio_50, "-vol_63", "-max_21", "-ret_skew_126",
                  "-idio_vol_63", "-downside_vol_63"]

  output:
    save_cube: true
    save_panel: false
    save_signal: true
    save_cv_results: false
    save_predictions: true
    save_shap: true
    save_models: true
