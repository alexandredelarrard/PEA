seed: 4325

data_extract:
  years_history: 31
  macro_years_history: 31
  sharadar_years_history: 31 # SF1's earliest filing date is 1993-12-22
  sharadar_request_pace: 0.35
  # The one retry policy for every SEC request (`utils/common/sec_io.py`): HTTP 429/502/503/504
  # (and, for requests-based GETs and downloads, connection errors) get `attempts` calls in total,
  # waiting `waits` seconds between them (the last repeats); a Retry-After lengthens a wait up to the cap.
  sec_retry:
    attempts: 3
    waits: [5, 20]
    retry_after_cap: 120
  # EDGAR document fetchers (`utils/edgar_extract/edgar_driver.py`): a key whose read rate in a run is
  # below `threshold`, with at least `min_failed` failed documents, re-reads only those documents
  # in up to `rounds` in-task rounds, waiting `waits` seconds before each; the rest is listed again
  # on the next run, which always exits 0.
  retry_rounds:
    rounds: 3
    waits: [60, 120, 240]
    threshold: 0.985
    min_failed: 2
  # Per-fetch cap on documents read in one run, newest first; a larger work list logs an ERROR and
  # drains over later runs. The one-time backlog run lifts it with `--no-cap`.
  max_documents_per_run: 5000
  # `modelling predict` refuses to score when the share of universe tickers whose own latest
  # prices / sharadar_fundamentals_facts / sharadar_fundamentals_history date is within the table's cadence
  # tolerance falls below this; `extraction-status` marks those three tables RED on the same rule.
  prediction_fresh_share: 0.95
  # Process-pool width of the offline `sec-fundamentals-history` full replay (CPU-bound; 1 runs
  # in-process), and the thread width of the `fundamentals-employees` ticker loop. It does NOT
  # size or throttle the `sec-fundamentals-facts` EDGAR walk, which uses parallel_fetch's
  # DEFAULT_WORKERS under the shared SEC rate limiter like the other walks.
  fundamentals_workers: 8
  # The read-only SEC vs Sharadar check (`fundamentals/check_sources.py`, `fundamentals-check`): a
  # shared field is listed when at least `field_share` of the exactly matched (ticker, as_of) rows
  # differ by more than `gap_pct` of |Sharadar|, with its `top_tickers` worst tickers. It only logs.
  fundamentals_check:
    gap_pct: 0.03
    field_share: 0.05
    top_tickers: 3
  # Guards on a DERIVED discrete quarter (`fundamentals/periods.py`). Both are calibrated
  # against confirmed as-filed quarters, not preference -- loosening either lets a wrong
  # number through, tightening either nulls a real one.
  fundamentals_periods:
    # How far a derived quarter whose sign matches NONE of its siblings may exceed the
    # largest quarter already observed that year, for a SIGNED field. Raised from 1.0 after
    # the 1.0 bar was measured rejecting real, as-filed quarters at 1.03-2.6x: Allstate
    # FY2023 (1.10x), Gilead FY2017 (1.26x, the TCJA writedown), S&P Global FY2014 (2.41x,
    # the $1.6B legal settlement), Genuine Parts 2025 (2.39x), Zimmer Biomet 2018 (2.59x),
    # Johnson Controls 2012 (2.59x), J.M. Smucker 2023 (1.99x). A charge-driven quarter
    # legitimately dwarfs the run-rate, so magnitude alone cannot tell it from a data
    # error; the `non_negative` SIGN test does the real work and this only backstops the
    # genuinely signed fields.
    max_opposite_sign_q4_ratio: 3.0
    # Ceiling on |annual| / (the periods' own annualised scale) before an annual fact that
    # resolved a DIFFERENT concept than the periods it is differenced against is treated as
    # an unrelated line. Only an UPPER bound: a year of offsetting quarters legitimately
    # foots to a small annual figure, and an annual that is too SMALL because it is the
    # wrong concept yields a negative quarter the sign test already rejects.
    q4_tag_mismatch_fy_max: 2.0
    # The same test applied to a weighted-average SHARE COUNT, where it is two-sided and
    # must be much tighter. A share count moves a few percent a year organically, so
    # anything near a whole multiple is a corporate action that rebased every prior figure.
    # 2.0 was measured to be exactly the wrong bound: a 2-for-1 split -- the commonest
    # ratio there is -- lands at 1.996-2.003 and half of them slipped through, putting
    # KR's fiscal-2013 Q4 at 2.74bn shares against a true 511M and EOG's fiscal-2012 at
    # 1.35bn against 269M. 1.5 clears every real annual move on both rosters (the largest
    # organic one is under 1.15) and rejects every split.
    share_basis_max_ratio: 1.5
