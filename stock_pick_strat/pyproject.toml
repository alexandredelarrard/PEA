[project]
name = "stock-pick-strat"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit (>=1.35)",
    "yfinance (>=0.2.40)",
    "pandas (>=2.2)",
    "numpy (>=1.26, <2.5)",
    "plotly (>=5.22)",
    "fredapi (>=0.5.2)",
    "requests (>=2.32)",
    "lxml (>=5.2)",
    "python-dotenv (>=1.0)",
    "pyarrow (>=16.1)",
    "tqdm (>=4.66)",
    "scipy (>=1.11)",
    "lightgbm (>=4.0)",
    "omegaconf (>=2.3)",
    "matplotlib (>=3.8)",
    "openpyxl (>=3.1)",
    "openai (>=2.45.0,<3.0.0)",
    "pytrends (>=4.9.2,<5.0.0)",
    "curl-cffi (>=0.7,<1.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "psycopg2-binary (>=2.9,<3.0)",
    "torch (>=2.6)",
    "transformers (>=4.40,<5.0)"
]

[tool.poetry]
package-mode = false

# Airflow "composer" for the industrialised nightly pipeline. Declared here per project convention,
# but it runs in its OWN container (apache/airflow, Python 3.12) — see Dockerfile.airflow /
# docker-compose.yml — NOT in this Python 3.13 venv (Airflow supports <=3.12 and pins SQLAlchemy
# <2.0, which conflicts with the pipeline's 2.0). The `python = "<3.13"` marker + `optional = true`
# keep it out of the local 3.13 resolution so the main lock is unaffected; the container gets
# Airflow from its base image and the pipeline deps from requirements-airflow.txt.
[tool.poetry.group.airflow]
optional = true

[tool.poetry.group.airflow.dependencies]
apache-airflow = { version = ">=2.10,<3.0", python = ">=3.9,<3.13" }

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
