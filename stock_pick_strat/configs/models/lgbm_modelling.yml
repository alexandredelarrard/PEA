# lgbm_modelling.yml -- LightGBM member: hyperparameters + its OWN feature set + monotone.
# Merged into the global config by read_config (distinct top-level key `lgbm`). Robust
# recipe chosen on cross-fold IC stability (foldIR): lr .02, min_child 100, eval=rmse,
# monotone ON. Keeps the sparse sector-specific + (not-yet-in-cube) f_ec_* columns --
# LightGBM handles NaN/sparsity natively.
lgbm:
  learning_rate: 0.01
  max_depth: 5
  num_leaves: 31
  subsample: 0.8
  bagging_freq: 1
  colsample_bytree: 0.8
  min_child_samples: 100
  lambda_l1: 5.0
  lambda_l2: 5.0
  num_boost_round: 3000
  early_stopping_rounds: 100
  eval_metric: rmse
  categoricals:
  - industry_group
  monotonic:
    enabled: true
    features:
    - amihud_63: 1
    - vol_63: -1
    - f_y_rev_growth_xs: 1
    - f_operating_margin_5y_chg_xs: 1
    - f_operating_leverage_xs: 1
    - f_revenue_per_employee_growth_xs: 1
    - f_acquisition_intensity_xs: -1
    - f_ebitda_to_ev_xs: 1
    - f_pegy_xs: -1
    - f_core_earnings_yield_xs: 1
    - f_nonrecurring_pretax_share_xs: -1
    - f_gross_profitability_xs: 1
    - f_rd_intensity_vs_peers: 1
