backtest:
  # window
  end: null                    # null -> cube max date
  starting_capital: 1000000
 
  # --- construction (optimizer) ---
  market_weight: 0.0          # deliberate SPY beta sleeve (total portfolio beta = this)
  target_ann_vol: 0.1          # alpha-sleeve ex-ante volatility target
  beta_neutral: true           # enforce beta'w = 0 (market-neutral alpha sleeve)
  sector_neutral: true         # enforce net exposure ~0 per GICS industry group (24)
  pos_cap: 0.05                # max |weight| per name
  gross_cap: 3.0               # max sum|w| (leverage safety)
 
  # --- turnover control (the cost fix) ---
  step: 0.35                   # partial trade toward target; lower = slower = cheaper
  no_trade_band: 0.0           # optional: skip per-name trades smaller than this
  rebalance_freq: 63            # recompute target every N days

  # --- vol-regime de-risking (less volatile through high-vol periods) ---
  vol_scaling: true            # scale BOTH sleeves by clip(target/trailing-SPY-vol, floor, cap)
  regime_target_vol: 0.15      # SPY ann-vol at which the exposure multiplier = 1.0
  regime_vol_window: 63        # trailing window for the SPY vol estimate
  regime_scale_floor: 0.3      # min exposure in a deep vol spike (2020/2022)
  regime_scale_cap: 1.5        # max exposure in calm markets

  # --- risk-model windows ---
  beta_window: 63
  vol_window: 63

  # --- costs / blend ---
  fee_bps: 1.0
  spread_bps: 5.0
  blend: ir                    # ir | equal  (multi-horizon combine)
  risk_free_rate: 0.03
  compare: true                # run + log the OOS construction comparison vs SP500
  compare_market_weight: 1.0   # SPY sleeve for the "with spy" comparison variant

  # --- multi-STRATEGY blend (day-by-day, vol-weighted across sleeves) ---
  # Blend several diversifying return streams into one book: inverse-vol (risk-parity) mix across
  # sleeves + one portfolio-level leverage to hit `portfolio_vol_target`. Recomputed every day
  # from trailing vols (point-in-time). The trend sleeve is read from `trend_asset_returns`
  # (run StepTrendAssetClass first). See src/post_processing/utils/strategies_blend.py.
  strategy_blend:
    enabled: true
    # Two diversifying sleeves only: the market-NEUTRAL equity alpha + the multi-asset trend book.
    # No standalone SPY sleeve — the equity BETA is provided DYNAMICALLY by trend's equity leg
    # (long when equities trend up, flat/short when they roll over), so market exposure isn't
    # double-counted. (Trend risk-budgets across asset classes internally; see modelling_trend_asset.)
    strategies: [equity_ls, trend_asset]
    scheme: inverse_vol         # inverse_vol (risk parity) | equal
    vol_window: 63              # trailing window for per-sleeve + portfolio vol
    portfolio_vol_target: 0.10  # annualized total-book volatility target
    max_weight: 0.7             # cap any single sleeve's mix weight
    max_leverage: 2.0           # cap total leverage applied to hit the vol target

  # --- multi-ASSET ALLOCATION sleeve (StepAllocationBacktest) ------------------
  # Long-only % allocation across risky assets (equity / gold / 10Y bond / FX) with CASH
  # as the residual/funding leg, driven off the long-history `macro_asset_prices` table
  # (FRED, since ~1995). Layered: (1) risk-parity MIX [erc | inverse_vol], (2) long-only
  # TREND overlay that scales an asset toward cash when it rolls over, (3) one global
  # leverage to hit `portfolio_vol_target`. Fees charged on weight turnover. Separate from
  # the equity L/S backtest above. See src/post_processing/utils/strategies_alloc.py.
  asset_allocation:
    enabled: true
    start: "2000-01-01"          # backtest window start (macro_asset_prices reaches ~1995)
    end: null                    # null -> table max date
    include_fx: true             # add the USD/EUR leg (NaN before 1999)
    include_ls: false            # add the equity L/S alpha stream as a 5th sleeve (from 2012)
    # weighting
    scheme: erc                  # erc (equal risk contribution) | inverse_vol
    vol_window: 63               # trailing window for the covariance / vol estimate
    rebalance_freq: 21           # recompute target weights every N trading days (monthly)
    # trend overlay (long-only): scale each risky weight toward `trend_floor` on downtrends.
    # DEFAULT chosen from the since-2000 sweep: binary 3/6/12m gives the best DRAWDOWN control
    # (maxDD ~-15% vs ~-27% no-trend / linear) for a small Sharpe give-up — binary fully exits
    # a downtrend and cuts the tail, whereas linear only trims proportionally (DD ~ no-trend).
    # Set trend_enabled:false for max Sharpe (risk-parity only), or trend_scheme:linear for a
    # smoother, lighter-touch de-risk. Sweep numbers: no_trend S=0.57/DD-27; binary_3_6_12m
    # S=0.50/DD-15; linear_6_12m S=0.55/DD-26.
    trend_enabled: true
    trend_scheme: binary         # binary (on/off, best DD control) | linear (smooth, downside-only)
    trend_lookbacks: [63, 126, 252]  # 3/6/12m blend (multi-speed TSMOM)
    trend_vol_window: 63
    trend_floor: 0.0             # min weight multiplier in a downtrend (0 = fully to cash)
    trend_cap: 2.0
    # sizing
    portfolio_vol_target: 0.10   # annualized total-book volatility target (play with this)
    max_leverage: 2.0            # hard leverage ceiling (used when lev_responsive: false)
    # vol-responsive leverage: the ceiling scales 1x (stress) -> 2x (calm) with the risk-on
    # score, so the book takes MORE total risk when crash-prob is low and de-levers in stress.
    lev_responsive: true
    lev_min: 1.0                 # leverage ceiling in deep stress (score -> 0): no leverage
    lev_max: 2.0                 # leverage ceiling in a calm bull (score -> 1)
    # --- risk model + RISK-ON regime tilt (take MORE equity when calm, less when vol high) ---
    cov_mode: ewma               # ewma (reactive EWMA covariance, no 63d cliff) | std
    cov_halflife: 42             # EWMA halflife (days) for covariance + portfolio vol
    vol_mode: ewma               # ewma | std — portfolio vol estimator for the leverage target
    lever_on: base               # base (trend->cash truly de-risks) | scaled (legacy)
    risk_on_tilt: true           # tilt ERC risk budget toward equity/energy when crash-prob is low
    use_vix: true                # include VIX (macro_asset_prices.vix) in the risk-on score
    offensive: [equity, energy]  # sleeves lifted in risk-on regimes
    off_share_min: 0.15          # min offensive RISK share (deep stress)
    off_share_max: 0.85          # max offensive RISK share (calm bull market)
    # costs (CONSERVATIVE: ~10 bps one-way per unit turnover on liquid multi-asset ETFs)
    fee_bps: 2.0
    spread_bps: 8.0
    risk_free_rate: 0.02         # for the Sharpe numerator
    starting_capital: 1000000

  # --- UNIFIED 3-STRATEGY portfolio backtest (StepPortfolioBacktest) -----------
  # Blend the three strategy sleeves' daily return streams into one book: risk-parity
  # (inverse-vol EWMA) or ERC across sleeves + one global vol target / leverage. Each sleeve
  # runs its own prediction/weighting internally (ls_equity wraps the trained L/S models,
  # long_book the macro allocation, trend_cta a long/short CTA on the macro assets). L/S is
  # out-of-sample only (starts at the model train_end). See src/post_processing/backtest/.
  portfolio_backtest:
    enabled: true
    start: "2023-01-01"
    end: null                    # null -> last common date
    sleeves: [ls_equity, long_book, trend_cta]
    scheme: erc                  # erc (correlation-aware) | inverse_vol  — across SLEEVES
    cov_mode: ewma               # ewma | std — sleeve covariance for the mix
    cov_halflife: 63
    vol_window: 63               # trailing window for the sleeve mix + global vol
    rebalance_freq: 21           # recompute sleeve mix every N days
    portfolio_vol_target: 0.10   # GLOBAL annualized volatility target (adjustable)
    max_leverage: 2.0            # GLOBAL leverage cap (adjustable)
    risk_free_rate: 0.02
    starting_capital: 1000000
    # trend_cta sleeve — self-contained long/short book on the macro_asset_prices assets
    trend:
      include_fx: true
      lookbacks: [63, 126, 252]  # 3/6/12m multi-speed TSMOM
      vol_window: 63
      signal_cap: 2.0
      per_asset_vol_target: 0.15
      sleeve_vol_target: 0.10    # trailing-vol-scale the whole CTA book to ~this ann-vol
      rebalance_freq: 5
      fee_bps: 2.0
      spread_bps: 8.0