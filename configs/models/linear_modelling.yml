# linear_modelling.yml -- elastic-net member: hyperparameters + its OWN (leaner) feature
# set. Merged via read_config (top-level key `linear`). alpha .001/l1 .3 (alpha .05 zeroed
# all coefs -> NaN). Drops the sparse sector-specific features (NaN->0 for a linear model)
# and the f_ec_* (not in the cube yet).
linear:
  task: regression             # the linear family is regression-only
  kind: elasticnet
  alpha: 0.001
  l1_ratio: 0.6
  max_iter: 1000
  tol: 1.0e-06
  columns:
  - f_revenue_cagr_3y
  - f_y_earnings_growth_signed
  # - f_cash_runway_months
  - f_reported_expected_eps_yield
  - f_intangibles_to_assets
  # - f_earnings_sue_lag4 # delta Net Income vs 4q / std earnings 8q
  - f_y_rev_growth_accel
  # - f_sustainable_growth_rate
  - f_option_overhang # to check: why more actions leads to higher value ?
  - f_fcf_to_ev_vs_peers
  - f_returnOnEquity
  - f_accruals_ratio
  - f_gross_profitability
  # - f_revenue_per_employee # to normalize to have it as % of revenue per employee
  - f_reported_expected_eps_growth_qoq # -1 trend , why ?
  - f_diluted_shares_growth  # significant, but weird N shape ??
  - f_dividend_growth
  - f_book_yield
  - f_payout_ratio
  - f_rd_capitalized_roic
  - f_days_since_earnings
  - f_shareholder_yield
  - f_dso_vs_hist # kindof regime based 2 regimes.
  - f_gmroi_vs_hist # what is that ?
  - f_fcf_margin_vs_hist
  - f_capex_to_dep
  - f_sales_yield_vs_hist
  - f_ebitda_to_ev_vs_hist
  - f_intrinsic_yield
  - f_eps_surprise_4q_avg
  - f_ocf_yield
  - f_earnings_sue_lag3
  # - f_y_earnings_growth -> 2 regimes again
  # - f_intangibles_to_equity -> to review because 2 different regimes
  # - f_sbc_intensity -> 2 regimes ? cut 0.04

  # PRICE VARS
  # - ma_ratio_200
  # - ma_ratio_50 # can be killed, redundant
  - rsi_14
  - peer_mom_63
  - dollar_volume_63

  # GOV VARS
